name: Publish Story to Instagram

# Publishes each newly generated story as an Instagram IMAGE CAROUSEL
# (cover + slides, in reading order). Never a Reel/video. See
# docs/INSTAGRAM_PUBLISHING.md and publish_instagram.py.
#
# Trigger: runs automatically when "Daily Story Generator" completes
# successfully (workflow_run fires on completion, so it is unaffected by
# that workflow's "[skip ci]" commit message), plus manual runs for
# diagnostics. There is deliberately NO schedule -- one trigger per
# generated story, and the publication store (branch
# instagram-publication-state) makes any extra or re-run trigger a no-op
# for stories that are already published or in progress.
#
# Live publishing requires the repository VARIABLE
# INSTAGRAM_AUTO_PUBLISH_ENABLED=true. Until then, every run (including
# the automatic one) is a dry run: no image hosting, no Instagram calls,
# no state writes.
on:
  workflow_run:
    workflows: ["Daily Story Generator"]
    types: [completed]

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no uploads, no Instagram calls, no state writes)"
        required: true
        type: boolean
        default: true
      content_id:
        description: "Optional: only consider this Content ID (still duplicate-protected)"
        required: false
        type: string

# contents: write is needed only to push the publication history to the
# dedicated instagram-publication-state branch (never main).
permissions:
  contents: write

# One publisher at a time. Never cancel an in-flight publish. Any queued
# run handles every eligible story, so GitHub replacing an older queued
# run with a newer one loses nothing.
concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Same reasoning as the other workflows: always operate on main's
      # persisted Content Library and story assets.
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decide Mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          ENABLED: ${{ vars.INSTAGRAM_AUTO_PUBLISH_ENABLED }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" != "false" ]; then
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "Dry run requested."
          elif [ "$ENABLED" != "true" ]; then
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "INSTAGRAM_AUTO_PUBLISH_ENABLED is not 'true' -- dry run only."
          else
            echo "live=true" >> "$GITHUB_OUTPUT"
            echo "Live publishing."
          fi

      # No secrets in this step at all.
      - name: Dry Run
        if: steps.mode.outputs.live != 'true'
        env:
          CONTENT_ID: ${{ inputs.content_id }}
          INSTAGRAM_EXPECTED_USERNAME: ${{ vars.INSTAGRAM_EXPECTED_USERNAME }}
          INSTAGRAM_MAX_STORY_AGE_DAYS: ${{ vars.INSTAGRAM_MAX_STORY_AGE_DAYS }}
          INSTAGRAM_MAX_POSTS_PER_RUN: ${{ vars.INSTAGRAM_MAX_POSTS_PER_RUN }}
        run: |
          python publish_instagram.py --content-id "$CONTENT_ID"

      - name: Publish Carousel
        if: steps.mode.outputs.live == 'true'
        env:
          CONTENT_ID: ${{ inputs.content_id }}
          INSTAGRAM_AUTO_PUBLISH_ENABLED: ${{ vars.INSTAGRAM_AUTO_PUBLISH_ENABLED }}
          INSTAGRAM_EXPECTED_USERNAME: ${{ vars.INSTAGRAM_EXPECTED_USERNAME }}
          INSTAGRAM_GRAPH_API_VERSION: ${{ vars.INSTAGRAM_GRAPH_API_VERSION }}
          INSTAGRAM_MAX_STORY_AGE_DAYS: ${{ vars.INSTAGRAM_MAX_STORY_AGE_DAYS }}
          INSTAGRAM_MAX_POSTS_PER_RUN: ${{ vars.INSTAGRAM_MAX_POSTS_PER_RUN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python publish_instagram.py --live --content-id "$CONTENT_ID"
